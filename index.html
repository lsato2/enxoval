<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Enxoval do Bebê</title>
<meta name="theme-color" content="#8d6cc0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Enxoval">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500;1,9..144,600&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f8f5fb;
  --card:#ffffff;
  --text:#3a3240;
  --muted:#8b8193;
  --line:#efe8f3;
  --purple:#7d5aa8;
  --purple-strong:#6a4796;
  --purple-soft:#f1eaf8;
  --hero1:#a46fd0;
  --hero2:#8d55bf;
  --head1:#9c80cf;
  --head2:#7f5fb3;
  --gold:#e8cf7c;
  --gold-text:#5b4708;
  --pink-soft:#f7e9ef;
  --icon:#8a6a86;
  --check:#b9a6cb;
  --shadow:0 6px 22px rgba(110,80,150,.08);
  --serif:'Fraunces', Georgia, 'Times New Roman', serif;
  --sans:'Nunito', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --safe-top:env(safe-area-inset-top, 0px);
  --safe-bottom:env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
a{color:inherit}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:calc(96px + var(--safe-bottom))}
.serif{font-family:var(--serif)}

/* ---------- HOME HEADER ---------- */
.home-head{background:linear-gradient(170deg,var(--head1),var(--head2));color:#fff;padding:calc(var(--safe-top) + 18px) 22px 70px;border-radius:0 0 44px 44px;position:relative}
.hh-top{display:flex;align-items:center;gap:10px}
.avatar{width:46px;height:46px;border-radius:50%;background:#c9b5ea;border:2px solid rgba(255,255,255,.85);display:grid;place-items:center;font-family:var(--serif);font-style:italic;font-weight:600;font-size:20px;color:#5a3f86;flex:none}
.hh-hello{font-family:var(--serif);font-weight:600;font-size:22px;flex:1}
.round-btn{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);display:grid;place-items:center;color:#fff}
.hh-row{display:flex;align-items:center;justify-content:space-between;margin-top:18px}
.phase-toggle{display:flex;border:1px solid rgba(255,255,255,.45);border-radius:999px;padding:3px}
.phase-toggle button{font-size:12px;font-weight:700;letter-spacing:.12em;padding:6px 14px;border-radius:999px;color:rgba(255,255,255,.75)}
.phase-toggle button.on{background:var(--gold);color:var(--gold-text)}
.link-under{font-size:14px;font-weight:600;text-decoration:underline;text-underline-offset:3px;color:#f3e3a6}
.hh-title{font-family:var(--serif);font-weight:600;font-size:26px;margin:18px 0 0}
.hh-pct-row{display:flex;align-items:flex-end;justify-content:space-between}
.hh-pct{font-family:var(--serif);font-weight:600;font-size:56px;line-height:1.1}
.hh-week{font-size:14px;opacity:.85;padding-bottom:12px}
.hh-week b{font-weight:700}
.bar{position:relative;height:6px;border-radius:6px;background:rgba(255,255,255,.28);margin-top:6px}
.bar .fill{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--gold)}
.bar .dot{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 4px rgba(232,207,124,.35)}

.quick{display:flex;background:#fff;border-radius:26px;box-shadow:var(--shadow);margin:-48px 16px 0;position:relative;z-index:2;padding:14px 8px}
.quick button{flex:1;display:flex;align-items:center;gap:10px;padding:2px 10px;text-align:left}
.quick button+button{border-left:1.5px solid var(--line)}
.qi{width:38px;height:38px;border-radius:50%;background:var(--purple-soft);color:var(--purple);display:grid;place-items:center;flex:none}
.qi svg.i{width:19px;height:19px}
.q-t{font-weight:700;font-size:16px}
.q-s{font-size:14px;color:var(--muted)}

/* compact sticky header on home */
.compact{position:fixed;left:0;right:0;top:0;z-index:30;transform:translateY(-110%);transition:transform .22s ease;pointer-events:none}
.compact.show{transform:none;pointer-events:auto}
.compact-inner{max-width:520px;margin:0 auto;background:linear-gradient(170deg,var(--head1),var(--head2));color:#fff;padding:calc(var(--safe-top) + 12px) 22px 46px;border-radius:0 0 34px 34px}
.compact-row{display:flex;align-items:center;justify-content:space-between}
.compact-lbl{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;letter-spacing:.14em}
.compact-pct{font-family:var(--serif);font-weight:600;font-size:28px}
.compact .quick{margin:-36px auto 0;max-width:488px}

/* ---------- LIST CARDS ---------- */
.sec-head{display:flex;align-items:center;justify-content:space-between;margin:28px 20px 14px}
.sec-head h2{font-family:var(--serif);font-weight:600;font-size:26px;margin:0}
.chips{display:flex;gap:8px}
.chip{border:1.5px solid #e6dcec;border-radius:999px;padding:6px 14px;font-size:15px;font-weight:600;background:#fff}
.lists{display:flex;flex-direction:column;gap:14px;padding:0 16px}
.lcard{display:flex;align-items:center;gap:14px;background:#fff;border-radius:26px;padding:18px 16px;box-shadow:var(--shadow);text-align:left;width:100%}
.lcard .lic{width:58px;height:58px;border-radius:18px;background:var(--purple-soft);color:var(--purple);display:grid;place-items:center;flex:none}
.lcard .lic svg.i{width:28px;height:28px;stroke-width:1.3}
.lcard .lbody{flex:1;min-width:0}
.lcard .lt{font-family:var(--serif);font-weight:600;font-size:21px;line-height:1.2}
.lcard .ls{font-size:15px;color:var(--muted);margin-top:2px}
.lcard .lbar{height:6px;border-radius:6px;background:#efe6f6;margin-top:10px;overflow:hidden}
.lcard .lbar i{display:block;height:100%;background:var(--purple);border-radius:6px}
.lcard .lpct{font-weight:700;color:var(--purple);font-size:17px}
.lcard .chev{color:#6f6577}
.divider{display:flex;align-items:center;gap:14px;margin:30px 16px 16px;font-size:13px;letter-spacing:.16em;font-weight:600;color:#6f6577}
.divider:before,.divider:after{content:"";flex:1;height:1px;background:#e3dbe8}
.mala{margin:0 16px;border:1.5px solid #e8def0;background:#f4eef9;border-radius:26px;padding:18px}
.mala-top{display:flex;gap:14px;align-items:center}
.mala-ic{width:52px;height:52px;border-radius:16px;border:1.5px solid #e2d6ec;background:#fbf8fd;display:grid;place-items:center;color:var(--purple);flex:none}
.mala h3{font-family:var(--serif);font-weight:600;font-size:21px;margin:0}
.mala p{margin:2px 0 0;color:var(--muted);font-size:15px}
.btn-primary{display:block;width:100%;background:#a07fcf;color:#fff;border-radius:999px;padding:14px;font-weight:700;font-size:17px;margin-top:16px;text-align:center}
.btn-primary:active{filter:brightness(.95)}
.btn-ghost{display:block;width:100%;border:1.5px solid #e2d6ec;color:var(--purple);border-radius:999px;padding:13px;font-weight:700;font-size:16px;margin-top:10px;text-align:center;background:#fff}
.btn-danger{color:#b4485b;border-color:#f0d3da}

/* ---------- BOTTOM NAV ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid #efe9f2;padding-bottom:var(--safe-bottom)}
.nav-in{max-width:520px;margin:0 auto;display:flex}
.nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 0 10px;text-decoration:none;color:#857c8c;font-size:13px;font-weight:600;position:relative}
.nav a svg.i{width:26px;height:26px;stroke-width:1.4}
.nav a.on{color:var(--purple)}
.nav a.on:before{content:"";position:absolute;top:0;width:36px;height:3px;border-radius:0 0 3px 3px;background:#9b7cc9}
.nav .badge{position:absolute;top:6px;left:calc(50% + 6px);background:#8b6a2e;color:#fff;font-size:11px;font-weight:700;border-radius:999px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 4px;border:2px solid #fff}
.nav .nav-av{width:28px;height:28px;border-radius:50%;background:#c9b5ea;color:#5a3f86;font-family:var(--serif);font-style:italic;font-weight:600;display:grid;place-items:center;font-size:14px}

/* ---------- DETAIL ---------- */
.topbar{position:sticky;top:0;z-index:20;background:rgba(248,245,251,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;align-items:center;padding:calc(var(--safe-top) + 10px) 16px 10px}
.topbar .back{width:44px;height:44px;border-radius:50%;background:#fbf4dd;display:grid;place-items:center;color:#5b5162;flex:none}
.topbar h1{flex:1;text-align:center;font-family:var(--serif);font-style:italic;font-weight:600;font-size:22px;margin:0 44px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero-wrap{margin:8px 16px 0;background:#f2e7f0;border-radius:28px;padding-bottom:8px}
.hero{background:linear-gradient(165deg,var(--hero1),var(--hero2));color:#fff;border-radius:28px;padding:18px 20px 20px}
.hero-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.hero-pct{font-family:var(--serif);font-weight:600;font-size:44px;line-height:1}
.pill-btn{display:flex;align-items:center;gap:6px;background:#fff8e8;color:#5a4a5f;border-radius:999px;padding:9px 16px;font-size:15px;font-weight:600;white-space:nowrap}
.pill-btn svg.i{width:18px;height:18px}
.hero-desc{font-size:15px;margin-top:10px;opacity:.95;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:80%}
.hero-bar{height:8px;border-radius:8px;background:rgba(80,30,110,.45);margin-top:16px;overflow:hidden}
.hero-bar i{display:block;height:100%;background:var(--gold);border-radius:8px}
.seg{display:flex;padding:10px 10px 4px}
.seg button{flex:1;padding:10px 6px;border-radius:999px;font-size:15px;font-weight:600;color:#5b5162}
.seg button span{font-size:13px;margin-left:5px;color:#8b8193}
.seg button.on{background:#fff6dc;box-shadow:0 2px 6px rgba(150,110,60,.08)}
.tabs{position:sticky;z-index:15;top:calc(var(--safe-top) + 64px);background:rgba(248,245,251,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;gap:26px;overflow-x:auto;padding:16px 20px 0;border-bottom:1px solid #ebe3ef;scrollbar-width:none;margin-top:6px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;white-space:nowrap;padding-bottom:10px;font-size:16px;font-weight:600;color:#7b7083;border-bottom:2.5px solid transparent;max-width:170px;overflow:hidden;text-overflow:ellipsis}
.tabs button.on{color:#4e4355;border-color:#9b7cc9}
.section{padding:22px 16px 0;scroll-margin-top:calc(var(--safe-top) + 120px)}
.s-head{display:flex;align-items:flex-start;justify-content:space-between;margin:0 4px 12px}
.s-title{font-size:15px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--purple-strong);display:flex;align-items:center;gap:10px}
.s-sub{font-size:14px;color:var(--muted);margin-top:3px}
.size-tag{font-size:12px;font-weight:700;letter-spacing:.05em;background:#efe6f6;color:#6b5490;border-radius:999px;padding:3px 9px}
.tag{font-size:12px;font-weight:700;letter-spacing:.1em;background:#efe8f2;color:#6f6577;border-radius:999px;padding:4px 10px;white-space:nowrap}
.scard{background:#fff;border-radius:24px;padding:4px 16px;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line);min-height:62px}
.row:last-child{border-bottom:0}
.ric{width:40px;height:40px;border-radius:50%;background:var(--pink-soft);color:var(--icon);display:grid;place-items:center;flex:none}
.ric svg.i{width:21px;height:21px;stroke-width:1.3}
.rbody{flex:1;min-width:0;text-align:left}
.rname{font-size:17px;font-weight:500;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rsub{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.row.done .rname{color:#9a90a2}
.row.done .ric{background:#efe6f6;color:var(--purple)}
.chk{width:34px;height:34px;border-radius:50%;border:1.6px solid var(--check);display:grid;place-items:center;flex:none;color:transparent;transition:background .15s}
.chk svg.i{width:18px;height:18px;stroke-width:2.4}
.chk.on{background:#9473c2;border-color:#9473c2;color:#fff}
.step{display:flex;align-items:center;background:var(--pink-soft);border-radius:999px;padding:3px;flex:none}
.step button{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#7a6f80}
.step button.plus{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.step button:disabled{opacity:.35}
.step span{min-width:46px;text-align:center;font-size:15px;font-weight:600;color:#5b5162}
.step.full{background:#efe6f6}
.step.full span{color:var(--purple)}
.opt-div{display:flex;align-items:center;gap:12px;font-size:13px;letter-spacing:.12em;color:#7b7083;font-weight:600;padding:14px 0 6px;border-bottom:1px solid var(--line)}
.opt-div:after{content:"";flex:1;height:1px;background:#e8e0ec;order:1}
.opt-div b{order:2;font-weight:600;letter-spacing:0}
.add-row{display:flex;align-items:center;gap:14px;padding:14px 0;color:#5b5162;font-size:17px;width:100%}
.add-row .ric{background:#f4eef5;color:#6f6577}
.tip{margin:22px 16px 0;background:#fff;border-radius:24px;padding:18px 20px;box-shadow:var(--shadow)}
.tip h4{margin:0 0 6px;font-family:var(--serif);font-weight:600;font-size:21px;display:flex;align-items:center;gap:8px}
.tip h4:before{content:"";width:7px;height:7px;border-radius:50%;background:#8b78a6}
.tip p{margin:0;color:#5b5162;line-height:1.55}
.empty{text-align:center;color:var(--muted);padding:28px 20px;font-size:15px}

/* ---------- GENERIC PAGES ---------- */
.page-h{padding:calc(var(--safe-top) + 22px) 20px 6px}
.page-h h1{font-family:var(--serif);font-weight:600;font-size:30px;margin:0}
.page-h p{color:var(--muted);margin:4px 0 0}
.field{display:block;margin:0 0 14px}
.field span{display:block;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--purple-strong);margin:0 0 6px 4px}
.field input,.field textarea,.field select{width:100%;border:1.5px solid #e6dcec;border-radius:16px;padding:13px 14px;background:#fff;font-size:16px;outline:none}
.field input:focus,.field textarea:focus,.field select:focus{border-color:#a98bd3}
.box{background:#fff;border-radius:24px;box-shadow:var(--shadow);padding:18px;margin:16px}
.searchbar{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid #e6dcec;border-radius:999px;padding:10px 16px;margin:6px 16px 0}
.searchbar input{border:0;outline:none;flex:1;font-size:17px;background:transparent}
.res-list{font-size:13px;color:var(--muted);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.task{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.wk{width:52px;flex:none;text-align:center;font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.05em}
.wk b{display:block;font-family:var(--serif);font-size:22px;color:var(--purple);letter-spacing:0}
.task.now .wk b{color:#b8901c}
.task.done .tname{text-decoration:line-through;color:#a59bab}
.tname{flex:1;font-size:16px}
.link-card{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.link-card:last-child{border-bottom:0}
.link-card a{flex:1;min-width:0;text-decoration:none}
.link-card .lt2{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.link-card .ls2{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#8b8193;flex:none}

/* ---------- SHEET ---------- */
.backdrop{position:fixed;inset:0;background:rgba(40,25,55,.38);z-index:60;opacity:0;transition:opacity .2s}
.backdrop.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;max-width:520px;margin:0 auto;background:var(--bg);border-radius:28px 28px 0 0;padding:10px 20px calc(24px + var(--safe-bottom));max-height:88vh;overflow-y:auto;transform:translateY(100%);transition:transform .25s ease}
.sheet.show{transform:none}
.grab{width:42px;height:5px;border-radius:5px;background:#ddd2e4;margin:0 auto 14px}
.sheet h2{font-family:var(--serif);font-weight:600;font-size:24px;margin:0 0 6px}
.sheet p.lead{color:var(--muted);margin:0 0 16px;line-height:1.5}
.inline{display:flex;gap:10px}
.inline .field{flex:1}
.toggle-line{display:flex;align-items:center;gap:10px;margin:4px 4px 14px;font-size:16px}
.toggle-line input{width:20px;height:20px;accent-color:#8d6cc0}
.review-card{background:#fff;border-radius:26px;box-shadow:var(--shadow);padding:28px 20px;text-align:center;margin:10px 0 18px}
.review-card .ric{width:76px;height:76px;margin:0 auto 14px}
.review-card .ric svg.i{width:38px;height:38px}
.review-card .rv-sec{font-size:13px;letter-spacing:.12em;font-weight:700;color:var(--purple-strong);text-transform:uppercase}
.review-card .rv-name{font-family:var(--serif);font-weight:600;font-size:26px;margin:6px 0 4px}
.review-card .rv-sub{color:var(--muted)}
.rv-btns{display:flex;gap:10px}
.rv-btns button{flex:1}
.rv-count{text-align:center;color:var(--muted);font-size:14px;margin-bottom:4px}
.share-text{white-space:pre-wrap;background:#fff;border-radius:18px;padding:14px;font-size:14px;max-height:40vh;overflow:auto;border:1.5px solid #ece4f0}
.toast{position:fixed;left:50%;bottom:calc(110px + var(--safe-bottom));transform:translateX(-50%) translateY(20px);background:#3e3346;color:#fff;padding:10px 18px;border-radius:999px;font-size:15px;z-index:80;opacity:0;transition:all .2s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%)}
.coming{text-align:center;padding:40px 24px}
.coming .qi{width:72px;height:72px;margin:0 auto 14px}
.coming .qi svg.i{width:34px;height:34px}
.phase-box{background:#fff;border-radius:20px;padding:14px 16px;margin-bottom:12px;box-shadow:var(--shadow)}
.phase-box b{display:inline-block;background:var(--gold);color:var(--gold-text);font-size:12px;letter-spacing:.12em;border-radius:999px;padding:3px 10px;margin-bottom:6px}
.phase-box p{margin:0;line-height:1.5;color:#5b5162}
/* ---------- PLANO ---------- */
.plan-hero{margin:calc(var(--safe-top) + 16px) 16px 0;background:linear-gradient(140deg,#e7dcf5,#f4eefa);border-radius:30px;padding:24px 22px 20px}
.ph-kicker{font-size:13px;letter-spacing:.2em;font-weight:600;color:var(--purple-strong)}
.ph-week{font-family:var(--serif);font-weight:600;font-size:44px;line-height:1.15;margin-top:4px}
.ph-month{color:#6f6577;font-weight:600;font-size:16px}
.ph-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid #ddd0ea;margin-top:16px;padding-top:14px;font-weight:600;color:var(--purple-strong);font-size:15px}
.ph-tri{color:#5b5162;border-left:1px solid #ddd0ea;padding-left:12px;white-space:nowrap}
.diary{display:flex;align-items:center;gap:14px;width:100%;background:#fff;border-radius:26px;box-shadow:var(--shadow);margin:18px 16px 0;padding:14px 16px;text-align:left;width:calc(100% - 32px)}
.diary-av{width:62px;height:62px;border-radius:50%;background:#fbf2f7;border:3px solid #d8b86a;display:grid;place-items:center;color:#8d6cc0;flex:none}
.diary-av svg.i{width:32px;height:32px}
.diary-b{flex:1;min-width:0}
.diary-t{font-weight:700;font-size:17px}
.diary-s{color:#6f6577;font-size:14px;margin-top:2px}
.t-chev{color:#9a90a2;flex:none;align-self:center}
.t-chev svg.i{width:18px;height:18px}
.diary .t-chev{color:var(--purple)}
.plan-h{font-family:var(--serif);font-weight:600;font-size:28px;margin:30px 20px 4px}
.plan-p{margin:0 20px 18px;color:#6f6577;font-size:16px;line-height:1.45}
.timeline{padding:0 16px 20px}
.tl-week{position:relative;padding:0 0 26px 40px}
.tl-week:before{content:"";position:absolute;left:10px;top:24px;bottom:0;width:1.5px;background:#e6dde9}
.tl-week:last-child:before{display:none}
.tl-head{display:flex;align-items:center;gap:10px;margin:0 0 12px -40px;min-height:24px}
.tl-dot{width:22px;height:22px;border-radius:50%;background:#efe9f0;display:grid;place-items:center;flex:none;margin-right:8px}
.tl-dot:after{content:"";width:10px;height:10px;border-radius:50%;background:#d9d2db}
.tl-week.past .tl-dot:after{background:#8a8490}
.tl-week.now .tl-dot{background:#e6dbf5}
.tl-week.now .tl-dot:after{width:14px;height:14px;background:#a57fd6}
.tl-lbl{font-size:14px;letter-spacing:.08em;font-weight:600;color:#5b5162}
.tl-week.now .tl-lbl{color:var(--purple-strong)}
.tl-here{background:#6b4a95;color:#fff;font-size:13px;font-weight:600;border-radius:999px;padding:3px 10px}
.tl-count{margin-left:auto;font-weight:600;font-size:14px;color:#5b5162}
.tl-items{display:flex;flex-direction:column;gap:12px}
.tcard{background:#fff;border-radius:24px;box-shadow:0 4px 18px rgba(110,80,150,.06);padding:18px 16px}
.t-main{display:flex;gap:14px;align-items:flex-start}
.t-chk{width:30px;height:30px;margin-top:1px;border-color:#bfa2e3;border-width:2px}
.t-body{flex:1;min-width:0;cursor:default}
.t-body[data-go],.t-body[data-act]{cursor:pointer}
.t-title{font-family:var(--serif);font-weight:600;font-size:19px;line-height:1.25}
.t-desc{color:#6f6577;font-size:15px;line-height:1.45;margin-top:4px}
.tcard.done .t-title{color:#a59bab;text-decoration:line-through;text-decoration-color:#cbbfd3}
.tcard.done .t-desc,.tcard.skip .t-desc{color:#aaa1b0}
.tcard.skip{opacity:.7}
.tcard.skip .t-title{color:#a59bab}
.t-prog{display:flex;align-items:center;gap:12px;margin-top:14px}
.t-bar{flex:1;height:6px;border-radius:6px;background:#f1ece9;overflow:hidden}
.t-bar i{display:block;height:100%;background:#a57fd6;border-radius:6px}
.t-prog span{font-size:14px;color:#6f6577;white-space:nowrap}
.t-extra{padding-left:44px;margin-top:10px;display:flex;flex-direction:column;align-items:flex-start;gap:10px}
.t-link{display:flex;align-items:center;gap:8px;color:#5a3f86;font-weight:700;font-size:15px}
.t-link svg.i{width:18px;height:18px}
.t-skip{color:#8b8193;font-size:15px;font-weight:600}
.t-skipped{color:#8b8193;font-size:14px}
.t-skipped button{color:var(--purple);font-weight:700;text-decoration:underline}
.btn-strong{display:block;width:100%;background:#6b4a95;color:#fff;border-radius:999px;padding:14px;font-weight:600;font-size:17px;text-align:center}
.plan-compact{max-width:488px;margin:calc(var(--safe-top) + 8px) auto 0;background:#fff;border-radius:22px;box-shadow:0 8px 26px rgba(110,80,150,.14);display:flex;align-items:center;gap:12px;padding:10px 16px;width:calc(100% - 32px)}
.pc-av{width:42px;height:42px;font-size:18px;border:0;background:#efe6f8;color:#5a3f86}
.pc-name{font-family:var(--serif);font-weight:600;font-size:19px}
.pc-wk{font-size:14px;color:#5b5162}
.pc-days{text-align:center;font-size:11px;letter-spacing:.08em;color:#5b5162;font-weight:600}
.pc-days b{display:block;font-family:var(--serif);font-size:24px;color:var(--purple-strong);letter-spacing:0;line-height:1}

</head>

   ESTADO (salvo no aparelho)
   ========================================================= */
const LS = 'enxoval.v1';
function defaults(){ return {have:{},hidden:{},custom:{},edits:{},links:[],plan:{},planWeek:{},diary:{},phase:1,settings:{name:'',role:'papai',dpp:'2027-03-20',baby:'Pedro',sex:'m'},onboarded:false}; }
function load(){ try{ const s = JSON.parse(localStorage.getItem(LS)); if(s){ const d=defaults(); return {...d,...s,settings:{...d.settings,...(s.settings||{})}}; } }catch(e){} return defaults(); }
let S = load();
function save(){ try{ localStorage.setItem(LS, JSON.stringify(S)); }catch(e){} }

const slug = s => s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const esc = s => String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ALL_LISTS = [...LISTS, MALA];
const listById = id => ALL_LISTS.find(l=>l.id===id);

function normItem(raw, base){
  const it = typeof raw==='string' ? {n:raw} : {...raw};
  it.id = base + '-' + slug(it.n);
  if(it.group){ it.group = it.group.map(g=>({n:g,id:it.id+'--'+slug(g)})); it.q = it.group.length; }
  it.q = it.q || 1;
  it.hasP = it.p != null;
  it.p = it.hasP ? it.p : it.q;
  return it;
}
function applyEdits(it){
  const e = S.edits[it.id]; if(!e) return it;
  const o = {...it};
  if(e.n) o.n = e.n;
  if(e.q){ o.q = +e.q; if(!o.hasP) o.p = o.q; }
  if(e.p!=null && e.p!==''){ o.p = Math.min(+e.p, o.q); o.hasP = o.p !== o.q; }
  if(o.p > o.q) o.p = o.q;
  o.note = e.note||''; o.link = e.link||'';
  return o;
}
/* Retorna as seções já com os itens do usuário mesclados */
function sectionsOf(list){
  return list.sections.map(sec=>{
    const sid = list.id + '-' + slug(sec.t);
    const mk = (arr, extra) => (arr||[]).map(r=>({...normItem(r, sid), ...extra}));
    let items = [...mk(sec.items,{}), ...mk(sec.opt,{o:true}), ...mk(sec.laterItems,{later:true})];
    (S.custom[sid]||[]).forEach(c=>items.push({id:c.id,n:c.n,q:c.q||1,p:c.q||1,hasP:false,o:!!c.o,custom:true}));
    items = items.filter(it=>!S.hidden[it.id]).map(applyEdits);
    return {...sec, id:sid, list, items};
  });
}
function haveOf(it){ if(it.group) return it.group.filter(g=>S.have[g.id]).length; return Math.min(S.have[it.id]||0, it.q); }
const partoT = (it,sec) => (it.o||it.later||sec.optional||sec.later) ? 0 : it.p;
const totalT = (it,sec) => (it.o||sec.optional) ? 0 : it.q;
function stats(list, phase){
  let need=0, got=0;
  for(const sec of sectionsOf(list)) for(const it of sec.items){
    const t = phase===1 ? partoT(it,sec) : totalT(it,sec);
    need += t; got += Math.min(haveOf(it), t);
  }
  return {need, got, pct: need ? Math.round(got/need*100) : 0};
}
function overall(phase){
  let need=0, got=0;
  LISTS.forEach(l=>{ const s=stats(l,phase); need+=s.need; got+=s.got; });
  return {need, got, pct: need ? Math.round(got/need*100) : 0};
}

/* Datas / semanas */
const MESES = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
function dppDate(){ const [y,m,d] = (S.settings.dpp||'').split('-').map(Number); return y ? new Date(y,m-1,d) : null; }
function gestWeek(){ const d=dppDate(); if(!d) return null; const lmp = new Date(d); lmp.setDate(lmp.getDate()-280); const w = Math.floor((Date.now()-lmp)/(7*864e5)); return Math.max(0, Math.min(42, w)); }
function monthRange(mr){ const d=dppDate(); if(!d||!mr) return ''; const a=(d.getMonth()+mr[0])%12, b=(d.getMonth()+mr[1])%12; return a===b ? MESES[a] : MESES[a]+'-'+MESES[b]; }
const roleWord = () => S.settings.role==='mamae' ? 'mamãe' : 'papai';
const initial = () => (S.settings.name||roleWord()).trim().charAt(0).toUpperCase();

/* ---------- LISTA (detalhe) ---------- */
function rowHTML(it, sec, opts={}){
  const h = haveOf(it);
  const done = h >= it.q;
  const ic = icon(iconFor(it.n, sec.list.icon));
  let sub = '';
  if(opts.showList) sub = `${esc(sec.list.t)} · ${esc(sec.t)}`;
  else if(it.group) sub = `${h}/${it.q} itens`;
  else if(it.hasP && !it.o && !it.later && !sec.later && !sec.optional) sub = `Para o parto: ${Math.min(h,it.p)} de ${it.p}${it.u?' '+it.u:''}`;
  else if(it.r) sub = `Recomendado: ${it.r} itens`;
  else if(it.note) sub = esc(it.note);
  let ctrl;
  if(it.group) ctrl = `<button class="icon-btn" data-act="group" data-id="${it.id}" aria-label="Abrir">${icon('chev')}</button>`;
  else if(it.q===1) ctrl = `<button class="chk ${done?'on':''}" data-act="toggle" data-id="${it.id}" aria-label="Marcar">${icon('check')}</button>`;
  else ctrl = `<div class="step ${done?'full':''}"><button data-act="dec" data-id="${it.id}" ${h<=0?'disabled':''} aria-label="Menos">${icon('minus')}</button><span>${h}/${it.q}</span><button class="plus" data-act="inc" data-id="${it.id}" ${done?'disabled':''} aria-label="Mais">${icon('plus')}</button></div>`;
  return `<div class="row ${done?'done':''}" id="row-${it.id}">
    <div class="ric">${ic}</div>
    <button class="rbody" data-act="${it.group?'group':'item'}" data-id="${it.id}"><div class="rname">${esc(it.n)}</div>${sub?`<div class="rsub">${sub}</div>`:''}</button>
    ${ctrl}</div>`;
}
const passFilter = it => detailFilter==='todos' || (detailFilter==='tenho' ? haveOf(it)>=it.q : haveOf(it)<it.q);

function viewList(list){
  const secs = sectionsOf(list);
  const s1 = stats(list, 1);
  const useNeed = s1.need ? s1 : stats(list,2);
  const counts = {todos:useNeed.need, tenho:useNeed.got, faltando:useNeed.need-useNeed.got};
  const body = secs.map(sec=>{
    const main = sec.items.filter(i=>!i.o && !i.later && passFilter(i));
    const opt = sec.items.filter(i=>i.o && passFilter(i));
    const lat = sec.items.filter(i=>i.later && passFilter(i));
    const total = sec.items.length;
    let right = '';
    if(sec.optional) right = '<span class="tag">OPCIONAL</span>';
    else if(sec.later) right = '<span class="tag">PARA DEPOIS</span>';
    let sub = '';
    if(sec.age) sub = `${sec.age}${monthRange(sec.months)?' · '+monthRange(sec.months):''}`;
    else if(sec.optional) sub = `${total} sugest${total===1?'ão':'ões'}`;
    const rows = [
      ...main.map(i=>rowHTML(i,sec)),
      opt.length ? `<div class="opt-div">OPCIONAIS <b>${opt.length}</b></div>` : '',
      ...opt.map(i=>rowHTML(i,sec)),
      lat.length ? `<div class="opt-div">PARA DEPOIS DO PARTO <b>${lat.length}</b></div>` : '',
      ...lat.map(i=>rowHTML(i,sec)),
    ].join('');
    const empty = !main.length && !opt.length && !lat.length;
    return `<section class="section" id="${sec.id}">
      <div class="s-head"><div><div class="s-title">${esc(sec.t)}${sec.size?`<span class="size-tag">${sec.size}</span>`:''}</div>${sub?`<div class="s-sub">${sub}</div>`:''}</div>${right}</div>
      <div class="scard">${empty?`<div class="empty">${detailFilter==='tenho'?'Nenhum item marcado ainda.':'Tudo certo por aqui!'}</div>`:rows}
        ${detailFilter==='todos'?`<button class="add-row" data-act="add" data-sec="${sec.id}" data-list="${list.id}"><div class="ric">${icon('plus')}</div>Adicionar item</button>`:''}
      </div></section>`;
  }).join('');
  return `
  <div class="topbar"><button class="back" data-act="back" aria-label="Voltar">${icon('back')}</button><h1>${esc(list.t)}</h1></div>
  <div class="hero-wrap">

/* ---------- PLANO ---------- */
const babyName = () => (S.settings.baby||'').trim();
const babyPron = () => S.settings.sex==='f' ? 'ela' : S.settings.sex==='m' ? 'ele' : 'o bebê';
function daysLeft(){ const d=dppDate(); if(!d) return null; const t=new Date(); t.setHours(0,0,0,0); return Math.max(0, Math.round((d-t)/864e5)); }
const gestMonth = w => Math.min(9, Math.floor(w/4.345)+1);
const trimestre = w => w<14 ? 1 : w<28 ? 2 : 3;
const taskWeek = t => S.planWeek[t.id] ?? t.w;
/* Itens do enxoval ligados a uma tarefa */
function taskItems(t){
  const out=[];
  for(const sl of (t.sel||[])){
    const list = listById(sl.l); if(!list) continue;
    for(const sec of sectionsOf(list)){
      if(sl.s && !sl.s.includes(sec.t)) continue;
      for(const it of sec.items){
        if(sl.n && !sl.n.some(n=>it.n===n || it.id.endsWith('-'+slug(n)))) continue;
        if(!sl.opt && (it.o || (sec.optional && !sl.s))) continue;
        out.push({it,sec,mode:sl.mode});
      }
    }
  }
  return out;
}
function taskProgress(t){
  if(t.sel && t.sel[0].mode==='whole'){ const s=stats(listById(t.sel[0].l),2); return {got: s.need && s.got>=s.need ? 1 : 0, need:1}; }
  let need=0, got=0;
  for(const {it,mode} of taskItems(t)){
    if(mode==='items'){ need+=1; got += haveOf(it)>=it.p ? 1 : 0; }
    else { const u = mode==='parto' ? it.p : it.q; need+=u; got+=Math.min(haveOf(it),u); }
  }
  return {got, need};
}
/* status: 'done' | 'skip' | 'open' | 'info' */
function taskStatus(t){
  if(t.kind==='info') return 'info';
  if(S.plan[t.id]==='skip') return 'skip';
  if(t.kind==='progress'){ const p=taskProgress(t); return p.need && p.got>=p.need ? 'done' : 'open'; }
  return S.plan[t.id] ? 'done' : 'open';
}
function pendingTasks(){ const wk=gestWeek()??0; return PLAN.filter(t=>taskWeek(t)<=wk && taskStatus(t)==='open').length; }

function taskCard(t, isNow){
  const st = taskStatus(t);
  const chev = (t.go||t.act||t.kind==='progress') ? `<div class="t-chev">${icon('chev')}</div>` : '';
  const nav = t.kind==='progress' ? `data-go="${t.go||'#/tarefa/'+t.id}"` : t.go ? `data-go="${t.go}"` : t.act ? `data-act="${t.act}"` : '';
  let prog='';
  if(t.kind==='progress'){ const p=taskProgress(t); prog = `<div class="t-prog"><div class="t-bar"><i style="width:${p.need?Math.round(p.got/p.need*100):0}%"></i></div><span>${p.got} de ${p.need}</span></div>`; }
  const extra = [];
  if(st==='skip') extra.push(`<div class="t-skipped">Você marcou que não vai fazer · <button data-act="task-undo" data-id="${t.id}">Desfazer</button></div>`);
  else if(st==='open'){
    if(t.postpone) extra.push(`<button class="t-link" data-act="task-post" data-id="${t.id}">${icon('calendar')} Quero programar para outro dia</button>`);
    if(t.skip) extra.push(`<button class="t-skip" data-act="task-skip" data-id="${t.id}">Não vou fazer</button>`);
  }
  const check = t.kind==='check' ? `<button class="chk t-chk ${st==='done'?'on':''}" data-act="task" data-id="${t.id}" aria-label="Concluir">${icon('check')}</button>` : '';
  return `<div class="tcard ${st}">
      <div class="t-main">${check}
        <div class="t-body" ${nav}><div class="t-title">${esc(t.t)}</div><div class="t-desc">${esc(t.d)}</div>${prog}</div>${chev}
      </div>${extra.length?`<div class="t-extra">${extra.join('')}</div>`:''}
    </div>
    ${isNow && t.kind==='progress' && st==='open' ? `<button class="btn-strong" data-go="#/tarefa/${t.id}">Ver esses itens no enxoval</button>` : ''}`;
}
function viewPlano(){
  const wk = gestWeek();
  const dl = daysLeft();
  const name = babyName();
  if(wk==null) return `<div class="page-h"><h1>Plano</h1></div><div class="box"><p class="lead">Defina a data prevista do parto em <b>Você</b> para ver o plano semana a semana.</p><button class="btn-primary" data-go="#/voce">Definir data</button></div>`;
  const reg = S.diary[wk];
  /* agrupa por semana */
  const groups = {};
  PLAN.forEach(t=>{ const w=taskWeek(t); (groups[w]=groups[w]||[]).push(t); });
  const weeks = Object.keys(groups).map(Number).sort((a,b)=>a-b);
  const nowWeek = weeks.filter(w=>w<=wk).pop();
  const timeline = weeks.map(w=>{
    const ts = groups[w];
    const countable = ts.filter(t=>t.kind!=='info');
    const done = countable.filter(t=>['done','skip'].includes(taskStatus(t))).length;
    const state = w===nowWeek ? 'now' : w<wk ? 'past' : 'future';
    return `<div class="tl-week ${state}">
      <div class="tl-head"><span class="tl-dot"></span><span class="tl-lbl">${w===0?'ANTES DA SEMANA 16':'SEMANA '+w}</span>${state==='now'?'<span class="tl-here">Você está aqui</span>':''}
        ${countable.length?`<span class="tl-count">${done} de ${countable.length}</span>`:''}</div>
      <div class="tl-items">${ts.map(t=>taskCard(t, state==='now')).join('')}</div>
    </div>`;
  }).join('');
  return `
  <div class="plan-hero">
    <div class="ph-kicker">ENXOVAL ${name?(S.settings.sex==='f'?'DA ':'DO ')+esc(name.toUpperCase()):'DO BEBÊ'}</div>
    <div class="ph-week">Semana ${wk}</div>
    <div class="ph-month">${gestMonth(wk)}º mês de gestação</div>
    <div class="ph-foot"><span>${dl? `Faltam ${dl} dia${dl===1?'':'s'} para ${babyPron()} chegar` : `Chegou a hora!`}</span><span class="ph-tri">${trimestre(wk)}º trimestre</span></div>
  </div>
  <button class="diary" data-act="diary">
    <div class="diary-av">${icon('baby')}</div>
    <div class="diary-b"><div class="diary-t">Semana ${wk} da gestação</div><div class="diary-s">${reg ? 'Registrado em '+fmtDate(reg.date) : 'Toque para registrar esta semana'}</div></div>
    <div class="t-chev">${icon('chev')}</div>
  </button>
  <h2 class="plan-h">Plano do enxoval</h2>
  <p class="plan-p">Um guia semana a semana para você saber o que fazer em cada etapa.</p>
  <div class="timeline">${timeline}</div>`;
}
function fmtDate(iso){ const d=new Date(iso); const m=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro']; return `${d.getDate()} de ${m[d.getMonth()]} de ${d.getFullYear()}`; }

/* =========================================================
   SHEETS (janelas de baixo)
   ========================================================= */
let sheetEl=null, backEl=null;
function openSheet(html){
  closeSheet(true);
  backEl = document.createElement('div'); backEl.className='backdrop'; backEl.onclick=()=>closeSheet();
  sheetEl = document.createElement('div'); sheetEl.className='sheet'; sheetEl.innerHTML = '<div class="grab"></div>'+html;
  document.body.append(backEl, sheetEl);
  requestAnimationFrame(()=>{ backEl.classList.add('show'); sheetEl.classList.add('show'); });
  return sheetEl;
}
function closeSheet(now){
  const s=sheetEl, b=backEl; sheetEl=backEl=null;
  if(!s) return;
  if(now){ s.remove(); b.remove(); return; }
  s.classList.remove('show'); b.classList.remove('show');
  setTimeout(()=>{ s.remove(); b.remove(); }, 260);
}
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),1800); }

function findItem(id){
  for(const l of ALL_LISTS) for(const sec of sectionsOf(l)) for(const it of sec.items){
    if(it.id===id) return {it,sec,list:l};
    if(it.group){ const g=it.group.find(g=>g.id===id); if(g) return {it,sec,list:l,sub:g}; }
  }
  return null;
}

function sheetItem(id){
  const f = findItem(id); if(!f) return;
  const {it,sec} = f;
  const isParto = !it.o && !it.later && !sec.optional && !sec.later;
  const s = openSheet(`
    <h2>${esc(it.n)}</h2><p class="lead">${esc(sec.list.t)} · ${esc(sec.t)}${it.r?` · Recomendado: ${it.r} itens`:''}</p>
    <label class="field"><span>Nome</span><input id="e-n" value="${esc(it.n)}"></label>
    <div class="inline">
      <label class="field"><span>Quantidade</span><input id="e-q" type="number" min="1" inputmode="numeric" value="${it.q}"></label>
      ${isParto?`<label class="field"><span>Para o parto</span><input id="e-p" type="number" min="0" inputmode="numeric" value="${it.p}"></label>`:''}
    </div>
    <label class="field"><span>Link do produto</span><input id="e-l" type="url" inputmode="url" placeholder="https://" value="${esc(it.link||'')}"></label>
    <label class="field"><span>Observação</span><textarea id="e-o" rows="2" placeholder="Cor, tamanho, marca, quem vai dar...">${esc(it.note||'')}</textarea></label>
    ${it.link?`<a class="btn-ghost" href="${esc(it.link)}" target="_blank" rel="noopener" style="text-decoration:none">Abrir link</a>`:''}
    <button class="btn-primary" id="e-save">Salvar</button>
    <button class="btn-ghost btn-danger" id="e-del">Remover da lista</button>`);
  s.querySelector('#e-save').onclick = ()=>{
    const n = s.querySelector('#e-n').value.trim() || it.n;
    const q = Math.max(1, parseInt(s.querySelector('#e-q').value)||1);
    const pEl = s.querySelector('#e-p');
    const link = s.querySelector('#e-l').value.trim(), note = s.querySelector('#e-o').value.trim();
    if(it.custom){
      for(const k in S.custom){ const c=S.custom[k].find(c=>c.id===id); if(c){ c.n=n; c.q=q; } }
      S.edits[id] = {...(S.edits[id]||{}), link, note};
    } else {
      S.edits[id] = {n, q, link, note}; if(pEl) S.edits[id].p = Math.max(0, parseInt(pEl.value)||0);
    }
    if((S.have[id]||0) > q) S.have[id]=q;
    if(link && !S.links.some(k=>k.url===link)) S.links.push({title:n, url:link, item:n});
    save(); closeSheet(); render(); toast('Item atualizado');
  };
  s.querySelector('#e-del').onclick = ()=>{
    if(it.custom){ for(const k in S.custom) S.custom[k]=S.custom[k].filter(c=>c.id!==id); }
    else S.hidden[id]=true;
    delete S.have[id]; save(); closeSheet(); render(); toast('Item removido');
  };
}

function sheetGroup(id){

  };
  const s = openSheet(draw());
  s.addEventListener('click', e=>{

function sheetReview(listId){
  const list = listById(listId);
  const queue=[];
  for(const sec of sectionsOf(list)) for(const it of sec.items) if(!it.group && haveOf(it)<it.q) queue.push({id:it.id, sec:sec.t});
  if(!queue.length){ openSheet(`<h2>Tudo revisado!</h2><p class="lead">Não há itens faltando nesta lista.</p><button class="btn-primary" data-x>Fechar</button>`).querySelector('[data-x]').onclick=()=>closeSheet(); return; }
  let i=0;
  const s = openSheet('');
  const draw = ()=>{
    if(i>=queue.length){ s.innerHTML = `<div class="grab"></div><h2>Revisão concluída</h2><p class="lead">Você passou por todos os itens que faltavam em ${esc(list.t)}.</p><button class="btn-primary" data-x>Fechar</button>`; s.querySelector('[data-x]').onclick=()=>closeSheet(); return; }
    const f = findItem(queue[i].id); if(!f){ i++; return draw(); }
    const it=f.it;
    s.innerHTML = `<div class="grab"></div><div class="rv-count">${i+1} de ${queue.length}</div>
      <div class="review-card"><div class="ric">${icon(iconFor(it.n, list.icon))}</div>
        <div class="rv-sec">${esc(queue[i].sec)}</div><div class="rv-name">${esc(it.n)}</div>
        <div class="rv-sub">${it.q>1?`Meta: ${it.q} unidades · você tem ${haveOf(it)}`:'Vocês já têm este item?'}</div></div>
      <div class="rv-btns"><button class="btn-ghost" data-r="skip" style="margin:0">Ainda falta</button><button class="btn-primary" data-r="have" style="margin:0">Já tenho</button></div>
      <button class="btn-ghost" data-r="hide">Não vou usar</button>`;
    s.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{
      const r=b.dataset.r;
      if(r==='have') S.have[it.id]=it.q;
      if(r==='hide') S.hidden[it.id]=true;
      save(); render(); i++; draw();
    });
  };
  draw();
}

function chaText(){
  let out = '🎁 Lista do nosso chá de bebê\nItens que ainda faltam:\n';
  for(const l of LISTS){
    const lines=[];
    for(const sec of sectionsOf(l)) for(const it of sec.items){
      if(it.o||sec.optional) continue;
      const falta = it.q - haveOf(it);
      if(falta>0) lines.push(`• ${it.n}${falta>1?` (${falta})`:''}`);
    }
    if(lines.length) out += `\n${l.t}\n${lines.join('\n')}\n`;
  }
  return out.trim();
}
function sheetCha(){
  const txt = chaText();
  const s = openSheet(`<h2>Chá de bebê</h2><p class="lead">Compartilhe com a família e os amigos o que ainda falta no enxoval.</p>
    <div class="share-text">${esc(txt)}</div>
    ${navigator.share?'<button class="btn-primary" id="c-share">Compartilhar</button>':''}
    <button class="${navigator.share?'btn-ghost':'btn-primary'}" id="c-copy">Copiar texto</button>`);
  const sh = s.querySelector('#c-share'); if(sh) sh.onclick = ()=>navigator.share({title:'Chá de bebê', text:txt}).catch(()=>{});
  s.querySelector('#c-copy').onclick = ()=>{ (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast('Lista copiada')).catch(()=>toast('Não foi possível copiar')); };
}
function sheetFases(){
  const s = openSheet(`<h2>Entenda as fases</h2><p class="lead">O enxoval é dividido em duas fases para vocês não comprarem tudo de uma vez.</p>
    <div class="phase-box"><b>FASE 1</b><p><strong>Essenciais para o parto.</strong> O que precisa estar pronto quando o bebê chegar: móveis, roupinhas RN, itens de banho, fraldas e o necessário para as primeiras semanas.</p></div>
    <div class="phase-box"><b>FASE 2</b><p><strong>Enxoval completo.</strong> Inclui o que fica “para depois”: roupas de 3 a 12 meses, fraldas M e G, introdução alimentar e as quantidades totais de cada item.</p></div>
    <p class="lead" style="margin-top:10px">Itens <b>opcionais</b> não entram na porcentagem.</p>
    <button class="btn-primary" data-x>Entendi</button>`);
  s.querySelector('[data-x]').onclick=()=>closeSheet();
}
function sheetAddLink(){
  const s = openSheet(`<h2>Salvar link</h2><p class="lead">Guarde o produto para comparar depois.</p>
    <label class="field"><span>Link</span><input id="k-u" type="url" inputmode="url" placeholder="https://"></label>
    <label class="field"><span>Nome do produto</span><input id="k-t" placeholder="Ex.: Carrinho travel system"></label>
    <label class="field"><span>Preço (opcional)</span><input id="k-p" placeholder="R$"></label>
    <button class="btn-primary" id="k-save">Salvar</button>`);
  setTimeout(()=>s.querySelector('#k-u').focus(),280);
  s.querySelector('#k-save').onclick=()=>{
    let url = s.querySelector('#k-u').value.trim(); if(!url){ s.querySelector('#k-u').focus(); return; }
    if(!/^https?:\/\//i.test(url)) url='https://'+url;
    S.links.unshift({url, title:s.querySelector('#k-t').value.trim(), price:s.querySelector('#k-p').value.trim()});
    save(); closeSheet(); render(); toast('Link salvo');
  };
}
function sheetPostpone(id){
  const t = PLAN.find(t=>t.id===id); const wk = gestWeek()??0;
  const opts=[]; for(let w=Math.max(wk,t.w)+1; w<=39; w++) opts.push(`<option value="${w}" ${w===taskWeek(t)?'selected':''}>Semana ${w}</option>`);
  const s = openSheet(`<h2>Programar para outro dia</h2><p class="lead">${esc(t.t)}</p>
    <label class="field"><span>Mover para</span><select id="pp-w">${opts.join('')}</select></label>
    <button class="btn-primary" id="pp-ok">Salvar</button>
    ${S.planWeek[id]!=null?'<button class="btn-ghost" id="pp-reset">Voltar para a semana sugerida</button>':''}`);
  s.querySelector('#pp-ok').onclick=()=>{ S.planWeek[id]=+s.querySelector('#pp-w').value; save(); closeSheet(); render(); toast('Etapa reprogramada'); };
  const r=s.querySelector('#pp-reset'); if(r) r.onclick=()=>{ delete S.planWeek[id]; save(); closeSheet(); render(); };
}
function sheetDiary(){
  const wk = gestWeek(); const reg = S.diary[wk]||{};
  const past = Object.keys(S.diary).map(Number).filter(w=>w!==wk).sort((a,b)=>b-a);
  const s = openSheet(`<h2>Semana ${wk} da gestação</h2><p class="lead">Registre como foi esta semana: consultas, sensações, peso, fotos que tiraram...</p>
    <label class="field"><span>Registro da semana</span><textarea id="dy-t" rows="5" placeholder="Escreva aqui">${esc(reg.text||'')}</textarea></label>
    <button class="btn-primary" id="dy-ok">Salvar registro</button>
    ${past.length?`<h3 class="serif" style="font-weight:600;margin:22px 0 8px">Semanas anteriores</h3>${past.map(w=>`<div class="phase-box"><b>SEMANA ${w}</b><p>${esc(S.diary[w].text)}</p></div>`).join('')}`:''}`);
  s.querySelector('#dy-ok').onclick=()=>{ const t=s.querySelector('#dy-t').value.trim(); if(t) S.diary[wk]={text:t,date:new Date().toISOString()}; else delete S.diary[wk]; save(); closeSheet(); render(); toast('Registro salvo'); };
}
function babyFields(pfx){
  return `<div class="inline"><label class="field"><span>Nome do bebê</span><input id="${pfx}-b" value="${esc(S.settings.baby)}" placeholder="Opcional"></label>
    <label class="field"><span>É</span><select id="${pfx}-s"><option value="m" ${S.settings.sex==='m'?'selected':''}>Menino</option><option value="f" ${S.settings.sex==='f'?'selected':''}>Menina</option><option value="" ${!S.settings.sex?'selected':''}>Ainda não sei</option></select></label></div>`;
}
function readBaby(root, pfx){ S.settings.baby = root.querySelector('#'+pfx+'-b').value.trim(); S.settings.sex = root.querySelector('#'+pfx+'-s').value; }
function sheetWelcome(){
  const s = openSheet(`<h2>Bem-vindo ao seu enxoval</h2><p class="lead">Conte um pouco sobre vocês para personalizar as listas.</p>
    <label class="field"><span>Seu nome</span><input id="w-n" placeholder="Seu nome"></label>
    <label class="field"><span>Você é</span><select id="w-r"><option value="papai">Papai</option><option value="mamae">Mamãe</option></select></label>
    <label class="field"><span>Data prevista do parto</span><input id="w-d" type="date" value="${esc(S.settings.dpp)}"></label>
    ${babyFields('w')}
    <button class="btn-primary" id="w-ok">Começar</button>`);
  s.querySelector('#w-ok').onclick=()=>{
    S.settings.name = s.querySelector('#w-n').value.trim();
    S.settings.role = s.querySelector('#w-r').value;
    S.settings.dpp = s.querySelector('#w-d').value || S.settings.dpp;
    readBaby(s,'w');
    S.onboarded = true; save(); closeSheet(); render();
  };
}

/* =========================================================
   AÇÕES
   ========================================================= */
document.addEventListener('click', e=>{
  if(sheetEl && sheetEl.contains(e.target)) return;
  const go = e.target.closest('[data-go]');
  if(go){ location.hash = go.dataset.go; return; }
  const b = e.target.closest('[data-act]'); if(!b) return;
  const a = b.dataset.act, id = b.dataset.id;
  switch(a){
    case 'back': if(history.length>1) history.back(); else location.hash='#/'; break;
    case 'phase': S.phase = +b.dataset.v; save(); render(); break;
    case 'fases': sheetFases(); break;
    case 'cha': sheetCha(); break;
    case 'toggle': { const f=findItem(id); S.have[id] = haveOf(f.it)>=1 ? 0 : 1; if(!S.have[id]) delete S.have[id]; save(); render(); break; }
    case 'inc': { const f=findItem(id); S.have[id] = Math.min(f.it.q, haveOf(f.it)+1); save(); render(); break; }
    case 'dec': { const f=findItem(id); S.have[id] = Math.max(0, haveOf(f.it)-1); if(!S.have[id]) delete S.have[id]; save(); render(); break; }
    case 'item': sheetItem(id); break;
    case 'group': sheetGroup(id); break;
    case 'add': sheetAdd(b.dataset.sec, b.dataset.list); break;
    case 'review': sheetReview(b.dataset.list); break;
    case 'filter': detailFilter = b.dataset.v; render(); break;
    case 'tab': { const el=document.getElementById(b.dataset.sec); if(el) el.scrollIntoView({behavior:'smooth', block:'start'}); break; }
    case 'task': if(S.plan[id]) delete S.plan[id]; else S.plan[id]='done'; save(); render(); break;
    case 'task-skip': S.plan[id]='skip'; save(); render(); toast('Etapa marcada como “não vou fazer”'); break;
    case 'task-undo': delete S.plan[id]; save(); render(); break;
    case 'task-post': sheetPostpone(id); break;
    case 'diary': sheetDiary(); break;
    case 'add-link': sheetAddLink(); break;
    case 'del-link': S.links.splice(+b.dataset.i,1); save(); render(); break;
    case 'save-settings':
      S.settings.name = document.getElementById('f-name').value.trim();
      S.settings.role = document.getElementById('f-role').value;
      S.settings.dpp = document.getElementById('f-dpp').value || S.settings.dpp;
      readBaby(document,'f');
      S.onboarded = true; save(); render(); toast('Dados salvos'); break;
    case 'export': {
      const blob = new Blob([JSON.stringify(S,null,1)], {type:'application/json'});
      const file = new File([blob], 'enxoval-backup.json', {type:'application/json'});
      if(navigator.canShare && navigator.canShare({files:[file]})) navigator.share({files:[file], title:'Backup do enxoval'}).catch(()=>{});
      else { const u=URL.createObjectURL(blob); const l=document.createElement('a'); l.href=u; l.download='enxoval-backup.json'; l.click(); setTimeout(()=>URL.revokeObjectURL(u),1000); }
      break; }
    case 'import': document.getElementById('f-import').click(); break;
    case 'restore': S.hidden={}; save(); render(); toast('Itens restaurados'); break;
    case 'reset': if(confirm('Apagar todas as marcações, itens adicionados e links?')){ S=defaults(); S.onboarded=true; save(); render(); toast('Tudo zerado'); } break;
  }
});
document.addEventListener('change', e=>{
  if(e.target.id==='f-import'){
    const f=e.target.files[0]; if(!f) return;
    f.text().then(t=>{ const d=JSON.parse(t); if(!d||typeof d!=='object'||!d.have) throw 0; S={...defaults(),...d}; save(); render(); toast('Backup importado'); })
     .catch(()=>toast('Arquivo inválido'));
  }
});
document.addEventListener('input', e=>{
  if(e.target.id==='q'){ searchQ = e.target.value; document.getElementById('results').innerHTML = searchResults(); }
});
/* Na busca, atualizar só os resultados para não perder o teclado */
const _render = render;
render = function(){
  if(route.name==='busca' && document.getElementById('q') && parseRoute().name==='busca'){ document.getElementById('results').innerHTML = searchResults(); renderNav(); return; }
  _render();
};

render();
if(route.name==='busca') setTimeout(()=>{ const q=document.getElementById('q'); q&&q.focus(); },100);
if(!S.onboarded) setTimeout(sheetWelcome, 400);
if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
